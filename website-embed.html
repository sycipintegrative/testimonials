<!-- Replace the existing testimonials embed with this entire block. -->
<iframe
  id="sycip-client-reviews"
  src="https://sycipintegrative.github.io/testimonials/"
  title="Client reviews of SyCip Integrative"
  style="display:block;width:100%;height:960px;border:0;"
></iframe>
<script>
(function () {
  var frame = document.getElementById('sycip-client-reviews');
  var origin = 'https://sycipintegrative.github.io';
  window.addEventListener('message', function (event) {
    if (event.origin !== origin || event.source !== frame.contentWindow) return;
    var data = event.data;
    if (!data || data.type !== 'sycip-testimonials-height' ||
        typeof data.height !== 'number' || !Number.isFinite(data.height) || data.height <= 0) return;
    frame.style.height = Math.ceil(data.height) + 'px';
  });
  function measure() {
    frame.contentWindow.postMessage({type: 'sycip-testimonials-measure'}, origin);
  }
  frame.addEventListener('load', measure);
  measure();
})();
</script>
